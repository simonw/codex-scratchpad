<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7ec8ff" />
      <stop offset="60%" stop-color="#bfe6ff" />
      <stop offset="100%" stop-color="#f4f9ff" />
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9dc98f" />
      <stop offset="100%" stop-color="#6ba866" />
    </linearGradient>
    <radialGradient id="sun" cx="85%" cy="15%" r="20%">
      <stop offset="0%" stop-color="#fff3b0" />
      <stop offset="100%" stop-color="#ffd166" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4a4a4a" />
      <stop offset="100%" stop-color="#2e2e2e" />
    </linearGradient>
  </defs>

  <rect width="600" height="450" fill="url(#sky)" />
